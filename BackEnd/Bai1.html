<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
	div.at-container {
		display: flex;
		align-items: center;
		justify-content: center;
		height: 100%;
	}
	.at-item {
		color: #3079ed; font-weight:bold; font-size:3em;
		
		animation-name: text-shadow-multicolor;
		animation-duration: 2.2s;
		animation-timing-function: ease;
		animation-delay: 0s;
		animation-iteration-count: infinite;
		animation-direction: normal;
		animation-fill-mode: none;
			
		/* shorthand
		animation: text-shadow-multicolor 2.2s ease 0s infinite normal none;*/
	}
	@keyframes text-shadow-multicolor {
			
		0% {
			text-shadow:0 0px 15px #f0f;
		}
		33% {
			text-shadow:0 0px 15px #0ff;
		}
		66% {
			text-shadow:0 0px 10px #0f0;
		}
		100% {
			text-shadow:0 0px 10px #ff0;
		}
	}
</style>
</link
    rel = "stylesheet";
    href = "https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
/>
</head>
<body>
    <div class='at-container'>
        <div class='at-item'>Đại Học UEH</div>
    </div>

    <img class="animate__animated"
         style="animation: xoay 2s linear infinite;"
         src="https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png"
         alt="logo Khoa Công nghệ thông tin Kinh doanh">

    <style>
        @keyframes xoay {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</body>
</html>
