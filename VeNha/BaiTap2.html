
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 2 - Tạo các đoạn văn</title>

    <style>
        /* a. Đại học UEH */
        #a {
            color: blue;
            text-align: center;
            font-weight: bold;
            text-decoration: underline;
            font-size: 30px;
        }

        /* b. Khoa CNTTD */
        #b {
            color: red;
            text-align: right;
            font-style: italic;
            border: 3px dotted yellow;
            border-radius: 10px;
            background-color: gray;
            font-size: 15px;
            opacity: 0.5;
        }

        /* c. Định dạng chữ BIT-UEH */
        #c {
            color: #A7DD3C;
            background: #FFFFFF;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 50px;
            font-weight: bold;
            text-align: center;
            padding: 40px 0;
            text-shadow: 2px 0 0px #800040, 3px 2px 0px rgba(77,0,38,0.5), 3px 0 3px #FF002B, 5px 0 3px #800015, 6px 2px 3px rgba(77,0,13,0.5), 6px 0 9px #FF5500, 8px 0 9px #802A00, 9px 2px 9px rgba(77,25,0,0.5), 9px 0 18px #FFD500, 11px 0 18px #806A00, 12px 2px 18px rgba(77,66,0,0.5), 12px 0 30px #D4FF00, 14px 0 30px #6A8000, 15px 2px 30px rgba(64,77,0,0.5), 15px 0 45px #80FF00, 17px 0 45px #408000, 17px 2px 45px rgba(38,77,0,0.5);
        }

        /* d. Logo BIT làm hình nền lặp lại và cố định */
        #d {
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSMecVei2XbVU_TWoeeMc1clxVz2_KTXkgDHRJRDn3A1-DUoawpKhwOChvS&s=10");
            background-size: 30px 30px;
            background-repeat: repeat;
            background-attachment: fixed;
            height: 60px;
        }

        /* e. Đoạn văn bị cắt bớt */
        #e {
            width: 100px;
            height: 50px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <p id="a">Đại học UEH</p>

    <p id="b">Khoa CNTTD</p>

    <p id="c">BIT-UEH</p>

    <p id="d"></p>

    <p id="e">Nhu cầu xã hội Ngành Thương mại điện tử (TMĐT) tại Việt Nam hiện nay đang có những bước tăng trưởng mạnh mẽ và ngày càng đóng góp nhiều hơn cho sự phát triển kinh tế xã hội của đất nước. Thị trường TMĐT Việt Nam đã trở nên sôi động hơn khi có nhiều</p>
</body>
</html>
