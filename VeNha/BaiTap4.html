
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập CSS - Câu 4</title>

    <style>
        /* Định dạng toàn bộ trang web */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        /* Định dạng tiêu đề */
        h3 {
            color: black;
        }

        /* Định dạng danh sách */
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        /* Định dạng từng mục trong danh sách */
        li {
            display: inline-block;
            width: 83px;
            background-color: cyan;
            text-align: center;
            margin-right: 2px;
        }

        /* Định dạng liên kết */
        a {
            color: blue;
        }
    </style>
</head>

<body>

    <h3>Bài tập CSS - Câu 4</h3>

    <ul>
        <li><a href="#">TMDT</a></li>
        <li><a href="#">ERP</a></li>
        <li><a href="#">MIS</a></li>
        <li><a href="#">DS</a></li>
    </ul>

</body>
</html>
