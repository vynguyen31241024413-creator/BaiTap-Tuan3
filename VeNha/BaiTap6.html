<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Học web chuẩn</title>
  <style>
    * { box-sizing: border-box; }


    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
    }


    ul { list-style: none; margin: 0; padding: 0; }
    a { text-decoration: none; }


    /* Khung chứa lớn */
    .portfolio {
      width: 100%;
      max-width: 1170px;
      margin: 0 auto;
      background: #fff;
    }


    /* Tiêu đề: nền xám nhạt */
    .portfolio h2 {
      margin: 0;
      padding: 40px 0 0;
      background: #f7f7f7;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #333;
      text-transform: uppercase;
    }


    /* Đường kẻ xanh ngắn dưới tiêu đề */
    .portfolio h2::after {
      content: "";
      display: block;
      width: 80px;
      height: 2px;
      background: #2a9d9d;
      margin: 18px auto 0;
    }


    /* Thanh tab */
    .list-tab {
      background: #f7f7f7;
      text-align: center;
      padding: 26px 10px 34px;
      margin-bottom: 20px;
    }


    .list-tab li {
      display: inline-block;
      margin: 0 9px 6px;
      white-space: nowrap;        /* không cho một tab bị ngắt dòng giữa chừng */
    }


    .list-tab a {
      font-size: 13px;
      font-weight: bold;
      color: #555;
    }


    .list-tab li:first-child a,
    .list-tab a:hover {
      color: #2a9d9d;
    }


    /* Thư viện ảnh: 3 ảnh / hàng */
    .galerry {
      font-size: 0;               /* bỏ khe trắng giữa các inline-block */
      text-align: center;
    }


    .galerry li {
      display: inline-block;
      width: 31%;
      margin: 0 1.1% 2.2%;
      vertical-align: top;
    }


    /* Khung ảnh có tỉ lệ 350x260, nền xanh + chữ làm "dự phòng".
       Nếu ảnh tải được thì ảnh phủ kín khung; nếu không thì vẫn thấy khối xanh. */
    .galerry a {
      position: relative;
      display: block;
      aspect-ratio: 350 / 260;
      background: #9ccc7a;
    }


    .galerry a::before {
      content: "Học Web Chuẩn";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: rgba(255, 255, 255, .75);
    }


    .galerry img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <section class="portfolio">
    <h2>MY PORTFOLIO</h2>
    <ul class="list-tab">
      <li><a href="./">All</a></li>
      <li><a href="./">Web App</a></li>
      <li><a href="./">UI/UX</a></li>
      <li><a href="./">Graphics Design</a></li>
      <li><a href="./">Mobile App</a></li>
      <li><a href="./">Branding</a></li>
      <li><a href="./">Marketing</a></li>
    </ul>
    <ul class="galerry">
      <li><a href="./"><img src="https://hocwebchuan.com/exercises/images/img_350x260.png" alt=""></a></li>
      <li><a href="./"><img src="https://hocwebchuan.com/exercises/images/img_350x260.png" alt=""></a></li>
      <li><a href="./"><img src="https://hocwebchuan.com/exercises/images/img_350x260.png" alt=""></a></li>
         </ul>
  </section>
</body>
</html>
